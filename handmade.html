<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaeiYn - Craft & Production</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --main-purple: #b5a9ff;
            --glass-white: rgba(255, 255, 255, 0.2);
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow-x: hidden;
            background-color: #f0f0ff; 
        }

        .full-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('背景.png'); 
            background-size: cover; background-position: center;
            background-repeat: no-repeat; z-index: -2;
        }

        

        /* --- 统一样式：侧边栏 (与主页严格对齐) --- */
        .sidebar {
            position: fixed; left: -300px; top: 5vh; width: 280px; height: 90vh;
            background: var(--glass-white);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex; flex-direction: column; padding: 30px 10px;
            box-sizing: border-box; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        .sidebar.active { left: 30px; }

        .menu-toggle {
            position: fixed; top: 40px; left: 40px; width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            color: var(--main-purple); font-size: 24px; cursor: pointer;
            z-index: 110; background: rgba(255, 255, 255, 0.3);
            border-radius: 50%; backdrop-filter: blur(5px);
        }

        .nav-link {
            display: flex; align-items: center; padding: 16px 20px;
            color: #8a96cc; text-decoration: none; border-radius: 20px;
            margin-bottom: 8px; font-size: 15px; transition: 0.3s;
            font-family: 'Cormorant Garamond', serif;
            line-height: 1;
        }

        /* 这里高亮 Handmade */
        .nav-link.active {
            background: white; color: var(--main-purple); font-weight: bold;
            box-shadow: 0 5px 15px rgba(181, 169, 255, 0.1);
        }
        .nav-link i { margin-right: 12px; width: 25px; text-align: center; }

        .sidebar-footer {
            margin-top: auto; text-align: center;
            color: var(--main-purple); opacity: 0.5; font-size: 24px;
        }

        /* --- Handmade 页面特有：内容区 --- */
        .content-container {
            position: relative;
            z-index: 10;
            padding: 120px 8% 50px;
            text-align: center;
        }

        .page-title {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic; font-size: 50px;
            color: var(--main-purple); letter-spacing: 5px;
            margin-bottom: 50px; text-shadow: 0 0 20px white;
        }

        /* 手工列表布局：采用两列交错感 */
        .handmade-list {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        .handmade-item {
            display: flex;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            border-radius: 35px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: 0.4s ease;
            text-align: left;
        }

        .handmade-item:hover {
            transform: scale(1.01);
            background: rgba(255, 255, 255, 0.4);
        }

        /* 奇数项图片在左，偶数项图片在右（可选） */
        .handmade-item:nth-child(even) { flex-direction: row-reverse; text-align: right; }

        .item-img {
            width: 40%;
            min-width: 300px;
            height: 300px;
            background: #eee;
            object-fit: cover;
        }

        .item-text {
            padding: 40px;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-text h3 {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
            font-size: 26px;
            color: var(--main-purple);
            margin: 0 0 15px 0;
        }

        .item-text p {
            font-size: 14px;
            color: #8a96cc;
            line-height: 1.8;
            margin: 0;
        }

    </style>
</head>
<body>

    <div class="full-bg"></div>

    <div class="menu-toggle" onclick="toggleSidebar(event)">
        <i class="fa-solid fa-bars"></i>
    </div>

    <nav class="sidebar" id="sidebar">
        <div style="height: 60px;"></div> 
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i>Home</a>
        <a href="Collaborations & Events.html" class="nav-link"><i class="fa-solid fa-star"></i>Collaborations & Events</a>
        <a href="Cosplay.html" class="nav-link"><i class="fa-solid fa-ribbon"></i>Creative Projects</a>
        <a href="handmade.html" class="nav-link active"><i class="fa-solid fa-paint-brush"></i>Craft & Production</a>
        <a href="photos.html" class="nav-link"><i class="fa-solid fa-camera"></i>Visuals</a>
        <div class="sidebar-footer"><i class="fa-solid fa-ribbon"></i></div>
    </nav>

    <div class="content-container">
        <h1 class="page-title">Craft & Production</h1>
        
        <div class="handmade-list">
            <div class="handmade-item">
                <img src="手工1.jpg" alt="Handmade 1" class="item-img">
                <div class="item-text">
                    <h3>Mystic Accessory</h3>
                    <p>使用天然水晶与丝线缠绕而成。每一个细节都蕴含着对梦幻色彩的追求。这件作品灵感来源于深夜的星空...</p>
                </div>
            </div>

            <div class="handmade-item">
                <img src="手工2.jpg" alt="Handmade 2" class="item-img">
                <div class="item-text">
                    <h3>Floral Crown</h3>
                    <p>手工绢花与仿生藤蔓的结合。为了呈现出森林精灵的质感，我在花瓣的染色上调试了很久...</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar(event) {
            event.stopPropagation();
            document.getElementById('sidebar').classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('active') && !sidebar.contains(event.target)) {
                sidebar.classList.remove('active');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HaeiYn - Creative Projects</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        :root {
            --main-purple: #b5a9ff;
            --glass-white: rgba(255, 255, 255, 0.2);
        }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow-x: hidden;
            background-color: #f0f0ff; 
        }

        /* --- 统一样式：背景 --- */
        .full-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('背景.png'); 
            background-size: cover; background-position: center;
            background-repeat: no-repeat; z-index: -2;
        }

        /* --- 统一样式：侧边栏 --- */
        .sidebar {
            position: fixed; left: -300px; top: 5vh; width: 280px; height: 90vh;
            background: var(--glass-white);
            backdrop-filter: blur(25px) saturate(150%);
            -webkit-backdrop-filter: blur(25px) saturate(150%);
            border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.4);
            display: flex; flex-direction: column; padding: 30px 10px;
            box-sizing: border-box; transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        .sidebar.active { left: 30px; }

        .menu-toggle {
            position: fixed; top: 40px; left: 40px; width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            color: var(--main-purple); font-size: 24px; cursor: pointer;
            z-index: 110; background: rgba(255, 255, 255, 0.3);
            border-radius: 50%; backdrop-filter: blur(5px);
        }

        .nav-link {
            display: flex; align-items: center; padding: 16px 20px;
            color: #8a96cc; text-decoration: none; border-radius: 20px;
            margin-bottom: 8px; font-size: 15px; transition: 0.3s;
            font-family: 'Cormorant Garamond', serif;
            line-height: 1;
        }

        /* 这里高亮 Cosplay Works */
        .nav-link.active {
            background: white; color: var(--main-purple); font-weight: bold;
            box-shadow: 0 5px 15px rgba(181, 169, 255, 0.1);
        }
        .nav-link i { margin-right: 12px; width: 25px; text-align: center; }

        .sidebar-footer {
            margin-top: auto; text-align: center;
            color: var(--main-purple); opacity: 0.5; font-size: 24px;
        }

        /* --- Cosplay 页面特有：内容区 --- */
        .content-container {
            position: relative;
            z-index: 10;
            padding: 120px 8% 50px;
            min-height: 100vh;
            text-align: center;
        }

        .page-title {
            font-family: 'Cormorant Garamond', serif;
            font-style: italic; font-size: 50px;
            color: var(--main-purple); letter-spacing: 5px;
            margin-bottom: 50px; text-shadow: 0 0 20px white;
        }

        /* 作品网格布局 */
        .work-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .work-card {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(15px);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: 0.4s ease;
            cursor: pointer;
        }

        .work-card:hover {
            transform: translateY(-10px) scale(1.02);
            background: rgba(255, 255, 255, 0.5);
        }

        .work-img {
            width: 100%;
            height: 350px;
            background: #eee; /* 图片未加载时的占位色 */
            object-fit: cover;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
        }

        .work-info {
            padding: 20px;
            color: #8a96cc;
        }

        .work-info h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
            font-family: 'Cormorant Garamond', serif;
            font-style: italic;
        }

        .work-info span {
            font-size: 13px;
            opacity: 0.8;
        }

    </style>
</head>
<body>

    <div class="full-bg"></div>

    <div class="menu-toggle" onclick="toggleSidebar(event)">
        <i class="fa-solid fa-bars"></i>
    </div>

    <nav class="sidebar" id="sidebar">
        <div style="height: 60px;"></div> 
        <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i>Home</a>
        <a href="Collaborations & Events.html" class="nav-link"><i class="fa-solid fa-star"></i>Collaborations & Events</a>
        <a href="Cosplay.html" class="nav-link active"><i class="fa-solid fa-ribbon"></i>Creative Projects</a>
        <a href="handmade.html" class="nav-link"><i class="fa-solid fa-paint-brush"></i>Craft & Production</a>
        <a href="photos.html" class="nav-link"><i class="fa-solid fa-camera"></i>Visuals</a>
        <div class="sidebar-footer"><i class="fa-solid fa-ribbon"></i></div>
    </nav>

    <div class="content-container">
        <h1 class="page-title">Creative Projects</h1>
        
        <div class="work-grid">
            <div class="work-card">
                <img src="作品1.jpg" alt="Work 1" class="work-img">
                <div class="work-info">
                    <h3>Character Name A</h3>
                    <span>Project Date: 2024</span>
                </div>
            </div>

            <div class="work-card">
                <img src="作品2.jpg" alt="Work 2" class="work-img">
                <div class="work-info">
                    <h3>Character Name B</h3>
                    <span>Project Date: 2023</span>
                </div>
            </div>

            <div class="work-card">
                <img src="作品3.jpg" alt="Work 3" class="work-img">
                <div class="work-info">
                    <h3>Character Name C</h3>
                    <span>Project Date: 2023</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleSidebar(event) {
            event.stopPropagation();
            document.getElementById('sidebar').classList.toggle('active');
        }

        document.addEventListener('click', function(event) {
            const sidebar = document.getElementById('sidebar');
            if (sidebar.classList.contains('active') && !sidebar.contains(event.target)) {
                sidebar.classList.remove('active');
            }
        });
    </script>
</body>
</html>
